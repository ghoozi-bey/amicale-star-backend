# ================== DATABASE ==================

# URL connexion PostgreSQL Supabase
spring.datasource.url=jdbc:postgresql://aws-1-eu-central-1.pooler.supabase.com:5432/postgres?sslmode=require

# Username base de données
spring.datasource.username=postgres.vfgmohqebqqnmhpbfeox

# Password base de données
spring.datasource.password=admin@2024+-

# ================== HIKARI ==================

# Nombre maximum de connexions
spring.datasource.hikari.maximum-pool-size=5

# Nombre minimum de connexions idle
spring.datasource.hikari.minimum-idle=1

# Timeout connexion inactive
spring.datasource.hikari.idle-timeout=10000

# Durée de vie maximale connexion
spring.datasource.hikari.max-lifetime=25000

# Timeout attente connexion
spring.datasource.hikari.connection-timeout=30000

# Keep alive connexion
spring.datasource.hikari.keepalive-time=15000

# Timeout validation connexion
spring.datasource.hikari.validation-timeout=5000

# Auto commit activé
spring.datasource.hikari.auto-commit=true

# ================== JPA ==================

# Affichage requêtes SQL
spring.jpa.show-sql=true

# Dialect PostgreSQL Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Mise à jour automatique schéma
spring.jpa.hibernate.ddl-auto=update

# Support objets LOB PostgreSQL
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ================== FILE ==================

# Dossier upload fichiers
file.upload-dir=C:/star/uploads/

# Taille max fichier upload
spring.servlet.multipart.max-file-size=10MB

# Taille max requête multipart
spring.servlet.multipart.max-request-size=10MB